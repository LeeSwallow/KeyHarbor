name: 제안 (proposal)
description: 파일·암호문 형식, CLI 명령, MCP 도구, 권한 정책, 보안 모델을 바꾸는 변경. 만들기 전에 합의한다.
title: "proposal: "
labels: ["proposal", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        큰 변경을 누군가 일주일을 쓰기 전에 합의하는 곳입니다. 여기서 논의하고, 관리자가 **accepted**를 붙이면 누구든 만들 수 있습니다. 구현 PR에는 ADR(docs/design/adr/)을 하나 추가합니다.
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 사용자나 에이전트가 지금 할 수 없는 것, 실제 사례와 함께.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 사용자와 에이전트에게 무엇이 바뀌나요. 형식, 명령, 도구.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 다른 방법과, 그것을 택하지 않는 이유.
  - type: textarea
    id: security
    attributes:
      label: 보안에 미치는 영향
      description: docs/design/03의 약속(S1–S5)과 위협 모델에 무엇이 달라지나요. 평문 비밀이 새로 지나가는 경로가 생기나요?
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: accepted가 되면 직접 만드실 건가요?
      options: ["예", "예, 안내가 있으면", "아니요"]
    validations:
      required: true
