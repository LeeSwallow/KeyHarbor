name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: the tag matches the crate version
        run: sh scripts/check-version.sh "$GITHUB_REF_NAME"
      - name: checks, once more on the tagged commit
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked
      - name: the tag is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: dependency licenses and advisories
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: the release build has no test-only features
        run: sh scripts/check-release-features.sh
      - run: cargo install cargo-about --locked --features cli
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  app:
    # The admin app (app/, J-93): KeyHarbor.app with the CLI in Contents/Helpers, as a DMG,
    # added to the release GoReleaser made. Apple silicon only, not signed or notarized.
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app
      - run: cargo install tauri-cli --locked --version ^2
      - run: npm ci
        working-directory: app/ui
      # beforeBuildCommand builds the UI and the CLI (tauri.conf.json).
      - run: cargo tauri build
        working-directory: app
      - name: name, verify and upload the DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="keyharbor-app-${version}-arm64.dmg"
          cp app/target/release/bundle/dmg/KeyHarbor_${version}_aarch64.dmg "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          gh release upload "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" --clobber
