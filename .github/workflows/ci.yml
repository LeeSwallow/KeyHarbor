name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The product: the root workspace (crates/). Ubuntu keeps the non-macOS build honest; the
    # keychain code is macOS-only and the tests use the file key store. The
    # browser tests drive the runner's real Chrome, headless.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: use the runner's Chrome for the real-browser tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          else
            chrome="$(which google-chrome)"
            # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -x "$chrome"
          echo "KEYHARBOR_TEST_CHROME=$chrome" >> "$GITHUB_ENV"
          echo "KEYHARBOR_BROWSER_HEADLESS=1" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  prototype:
    # prototype/: the browser-session prototype, its own workspace, tested with a fake browser.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototype
      - run: cargo test --locked

  deny:
    # Licenses, advisories, bans and sources of every dependency: deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # check-design.sh runs the design-check crate (ADR-0015).
      - uses: dtolnay/rust-toolchain@stable
      - run: sh scripts/check-docs.sh
      - run: sh scripts/check-layers.sh
      - run: sh scripts/check-design.sh
      - run: sh scripts/test-scripts.sh

  extension:
    # The browser extension (integrations/browser-extension): typecheck, build both browsers,
    # web-ext lint, vitest. The real-Chrome smoke test skips here (no KEYHARBOR_TEST_CHROME).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/browser-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/browser-extension/package-lock.json
      - run: npm ci
      - run: npm run check

  commits:
    # A commit names the people who made it. AI tools are not listed as
    # co-authors; see CONTRIBUTING.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: sh scripts/check-commit-trailers.sh "origin/${{ github.base_ref }}..HEAD"

  release-dry-run:
    # The release, built but not published: GoReleaser snapshot on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: the release build has no test-only features
        run: sh scripts/check-release-features.sh
      - run: cargo install cargo-about --locked --features cli
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - run: ls dist/*.tar.gz
