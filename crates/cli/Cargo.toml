[package]
name = "keyharbor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
keyharbor-domain = { path = "../domain" }
keyharbor-core = { path = "../core" }
keyharbor-guard = { path = "../guard" }
keyharbor-keystore = { path = "../keystore" }
keyharbor-mcp = { path = "../mcp" }
keyharbor-sqlite = { path = "../sqlite" }
keyharbor-supervisor = { path = "../supervisor" }
libc.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
tungstenite.workspace = true
keyharbor-sqlite = { path = "../sqlite", features = ["test-support"] }
keyharbor-keystore = { path = "../keystore", features = ["insecure-test-keystore"] }
tempfile.workspace = true
