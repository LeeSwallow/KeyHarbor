[package]
name = "keyharbor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
keyharbor-domain = { path = "../domain" }
keyharbor-broker = { path = "../broker" }
keyharbor-core = { path = "../core" }
keyharbor-mcp = { path = "../mcp" }
keyharbor-sqlite = { path = "../sqlite" }
keyharbor-vault = { path = "../vault" }
age.workspace = true
libc.workspace = true
rpassword.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
keyharbor-vault = { path = "../vault", features = ["insecure-test-keystore"] }
tempfile.workspace = true
