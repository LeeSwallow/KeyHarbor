[package]
name = "keyharbor-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
keyharbor-crypto = { path = "../crypto" }
keyharbor-domain = { path = "../domain" }
uuid.workspace = true
zeroize.workspace = true

[features]
# Lets KEYHARBOR_TEST_KEYSTORE_DIR select a plaintext root-key file. Tests only; never in release builds.
insecure-test-keystore = []

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
tempfile.workspace = true
