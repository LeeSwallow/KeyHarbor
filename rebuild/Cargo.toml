[workspace]
members = ["crates/domain", "crates/sqlite", "crates/vault", "crates/core", "crates/broker", "crates/mcp", "crates/cli"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
chacha20poly1305 = "0.11"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
zeroize = "1.9"
getrandom = "0.4"
age = "0.12"
security-framework = "3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7.5"
tokio = { version = "1.54", features = ["rt-multi-thread", "process", "net", "io-util", "time", "sync", "macros"] }
libc = "0.2"
base64 = "0.22"
