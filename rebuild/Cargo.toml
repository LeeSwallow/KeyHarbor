[workspace]
members = ["crates/domain", "crates/crypto", "crates/sqlite", "crates/vault", "crates/core", "crates/guard", "crates/broker", "crates/mcp", "crates/cli"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aho-corasick = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
diesel = { version = "2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
# Only one libsqlite3-sys can be linked; Diesel accepts < 0.39. `bundled` builds SQLite in.
libsqlite3-sys = { version = ">=0.30, <0.39", features = ["bundled"] }
tempfile = "3"
chacha20poly1305 = "0.11"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
zeroize = "1.9"
getrandom = "0.4"
age = "0.12"
security-framework = "3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7.5"
tokio = { version = "1.54", features = ["rt-multi-thread", "process", "net", "io-util", "time", "sync", "macros"] }
libc = "0.2"
base64 = "0.22"
