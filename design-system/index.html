<!doctype html>
<html lang="ko" data-theme="light" data-density="comfortable" data-pattern="graph">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeyHarbor Design System</title>
<link rel="stylesheet" href="keyharbor.css">
<link rel="stylesheet" href="showcase/showcase.css">
<script type="module" src="showcase/showcase.js"></script>
</head>
<body class="kh kh-canvas">
<header class="top"><div class="in">
  <div class="brand"><img src="../docs/design/assets/app-icon.svg" alt=""> KeyHarbor <span class="kh-badge neutral">design</span></div>
  <div class="kh-seg" id="theme"><button data-v="light" class="is-on"><span class="kh-i" style="mask-image:url(icons/house.svg)"></span><t data-en="Light">라이트</t></button><button data-v="dark"><span class="kh-i" style="mask-image:url(icons/lock.svg)"></span><t data-en="Dark">다크</t></button></div>
  <div class="kh-seg" id="density"><button data-v="comfortable" class="is-on"><t data-en="Comfortable">기본</t></button><button data-v="compact"><t data-en="Compact">촘촘</t></button></div>
  <div class="kh-seg" id="pattern"><button data-v="graph" class="is-on"><t data-en="Graph">모눈</t></button><button data-v="grid"><t data-en="Grid">격자</t></button><button data-v="dots"><t data-en="Dots">점</t></button><button data-v="none"><t data-en="None">없음</t></button></div>
  <div class="kh-seg" id="lang"><button data-v="ko" class="is-on">한국어</button><button data-v="en">English</button></div>
</div></header>
<main class="page" id="sections"></main>
</body>
</html>
